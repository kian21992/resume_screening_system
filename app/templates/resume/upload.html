{% extends 'base.html' %}
{% block title %}Upload Resumes{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in">
    <div class="col-lg-8">
        <div class="glass-panel p-5 mt-4 shadow-lg">
            <div class="card-body">
                <h2 class="text-center mb-5 border-bottom border-secondary pb-3 fw-bold"><i class="bi bi-file-earmark-arrow-up text-primary me-2"></i>Submit Candidate Resumes</h2>
                
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-4">
                        <label for="job_id" class="form-label">Target Job Position <span class="text-danger">*</span></label>
                        <select class="form-select" id="job_id" name="job_id" required>
                            <option value="" disabled selected>Select a job position...</option>
                            {% for job in jobs %}
                            <option value="{{ job.id }}">{{ job.title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-5">
                        <label class="form-label d-block text-center mb-3">Resume Documents <span class="text-danger">*</span></label>
                        <div class="file-upload-wrapper text-center d-flex flex-column align-items-center justify-content-center p-5" id="drop-zone">
                            <div id="file-input-holder">
                                <input type="file" id="resume-files" name="file" class="resume-file-input" accept=".pdf,.docx" multiple required>
                            </div>
                            <div class="upload-icon-container mb-3 d-flex align-items-center justify-content-center rounded-circle" style="background: #eef3f8; width: 72px; height: 72px; border: 1px solid #d8dee6;">
                                <i class="bi bi-cloud-arrow-up text-muted fs-1" id="upload-icon"></i>
                            </div>
                            <h5 class="fw-bold mb-1">Add up to 10 resumes</h5>
                            <p class="text-muted small mb-0">Choose one or more files in the same picker</p>
                            <span class="text-muted mt-2" style="font-size: 0.75rem;">Supports PDF and DOCX</span>
                        </div>
                        <div id="file-name-display" class="selected-file-list mt-3"></div>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary py-3 fs-5" id="submitBtn">
                            <i class="bi bi-check2-square me-2"></i> Screen Resumes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const resumeFileInput = document.getElementById('resume-files');
    const fileNameDisplay = document.getElementById('file-name-display');

    function renderSelectedFiles(files) {
        fileNameDisplay.innerHTML = '';

        if (files.length === 0) {
            return;
        }

        const summary = document.createElement('div');
        summary.className = 'selected-file-summary';
        summary.innerHTML = '<i class="bi bi-file-earmark-check-fill me-1"></i> ' + files.length + ' selected';
        fileNameDisplay.appendChild(summary);

        files.forEach(file => {
            const row = document.createElement('div');
            const icon = document.createElement('i');
            const name = document.createElement('span');

            row.className = 'selected-file-row';
            row.title = file.name;
            icon.className = 'bi bi-file-earmark-text me-2 flex-shrink-0';
            name.className = 'selected-file-name';
            name.textContent = file.name;

            row.appendChild(icon);
            row.appendChild(name);
            fileNameDisplay.appendChild(row);
        });
    }

    function handleFileSelection(e) {
        const files = Array.from(e.target.files || []);
        if (files.length > 10) {
            e.target.value = '';
            fileNameDisplay.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i> You can upload up to 10 resumes per screening.';
            return;
        }

        renderSelectedFiles(files);
        if (files.length > 0) {
            document.querySelector('.file-upload-wrapper').style.borderColor = 'var(--primary-color)';
            document.querySelector('.file-upload-wrapper').style.background = '#f1f5f9';
            document.querySelector('.upload-icon-container').style.background = '#eef3f8';
            document.querySelector('.upload-icon-container').style.borderColor = '#aebccc';
            document.getElementById('upload-icon').className = 'bi bi-file-earmark-text text-info fs-1';
        }
    }

    resumeFileInput.addEventListener('change', handleFileSelection);

    document.querySelector('form').addEventListener('submit', function() {
        if (!resumeFileInput.files.length) {
            return;
        }

        let btn = document.getElementById('submitBtn');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Processing Resume Batch...';
        btn.classList.add('disabled');
        btn.disabled = true;
    });
</script>
{% endblock %}
