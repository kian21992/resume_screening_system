{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="glass-panel p-4 shadow-lg">
            <div class="card-body">
                <div class="text-center mb-4">
                    <span class="fs-1 d-inline-block mb-1 text-primary"><i class="bi bi-folder2-open"></i></span>
                    <h2 class="fw-bold mb-1">Resume Screening Portal</h2>
                    <p class="text-muted small">Automated Resume Screening System</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2.5 fs-6">Sign In</button>
                </form>
                <div class="text-center mt-4 p-3 rounded-3" style="background: #f8fafc; border: 1px solid #d8dee6;">
                    <small class="text-muted">For testing, use credentials below:</small>
                    <div class="small text-light mt-1">
                        User: <strong>hr_admin</strong> &nbsp; | &nbsp; Pass: <strong>password123</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
