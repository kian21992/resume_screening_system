{% extends 'base.html' %}
{% block title %}{{ code }} - {{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-md-7 col-lg-5">
        <div class="glass-panel p-5 text-center shadow-lg">
            <div class="display-4 fw-bold text-primary mb-3">{{ code }}</div>
            <h1 class="h3 mb-3">{{ title }}</h1>
            <p class="text-muted mb-4">{{ message }}</p>
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
            {% else %}
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Return to Sign In</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
